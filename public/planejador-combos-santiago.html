<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planejador de Combos - We Love Chile</title>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.9/babel.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #1a0525 0%, #2d1045 100%);
            color: #f5ebe1;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background:
                radial-gradient(ellipse 600px 400px at 20% 30%, rgba(236, 72, 153, 0.12) 0%, transparent 70%),
                radial-gradient(ellipse 500px 500px at 80% 20%, rgba(219, 39, 119, 0.10) 0%, transparent 70%),
                radial-gradient(ellipse 400px 300px at 50% 70%, rgba(236, 72, 153, 0.08) 0%, transparent 70%),
                radial-gradient(ellipse 300px 300px at 90% 80%, rgba(244, 114, 182, 0.06) 0%, transparent 70%);
            pointer-events: none;
            z-index: 0;
            animation: shimmer 8s ease-in-out infinite alternate;
        }

        @keyframes shimmer {
            0% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.02); }
            100% { opacity: 0.7; transform: scale(0.98); }
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 1100px;
            margin: 0 auto;
        }

        /* SPARKLES */
        .sparkle {
            position: fixed;
            color: rgba(180, 160, 200, 0.4);
            pointer-events: none;
            z-index: 0;
            animation: twinkle-sparkle 3s ease-in-out infinite;
        }
        .sparkle:nth-child(1) { top: 5%; left: 8%; font-size: 2.2rem; animation-delay: 0s; }
        .sparkle:nth-child(2) { top: 12%; right: 10%; font-size: 1.4rem; animation-delay: 1.2s; color: rgba(180, 160, 200, 0.3); }
        .sparkle:nth-child(3) { top: 30%; right: 5%; font-size: 1.8rem; animation-delay: 0.5s; }
        .sparkle:nth-child(4) { top: 50%; left: 4%; font-size: 1.2rem; animation-delay: 2s; color: rgba(180, 160, 200, 0.25); }
        .sparkle:nth-child(5) { top: 65%; right: 8%; font-size: 2rem; animation-delay: 1.5s; }
        .sparkle:nth-child(6) { top: 80%; left: 10%; font-size: 1.5rem; animation-delay: 0.8s; color: rgba(180, 160, 200, 0.3); }
        .sparkle:nth-child(7) { top: 15%; left: 50%; font-size: 1rem; animation-delay: 2.5s; color: rgba(180, 160, 200, 0.2); }
        .sparkle:nth-child(8) { top: 45%; left: 92%; font-size: 1.6rem; animation-delay: 1.8s; }

        @keyframes twinkle-sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8) rotate(0deg); }
            50% { opacity: 1; transform: scale(1.2) rotate(15deg); }
        }

        /* Scrollbar styling */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(139, 92, 246, 0.1);
        }

        ::-webkit-scrollbar-thumb {
            background: #8B5CF6;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #9333EA;
        }

        .container-inner {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            text-align: center;
            margin-bottom: 40px;
            animation: slideUp 0.6s ease-out;
            position: relative;
        }

        .star-icon {
            position: absolute;
            top: 0;
            left: 20px;
            font-size: 2.5rem;
            animation: twinkle 2s ease-in-out infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.6; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.1); }
        }

        .logo-section {
            margin-bottom: 20px;
        }

        .logo-svg {
            width: 220px;
            height: auto;
            margin: 0 auto;
            filter: drop-shadow(0 10px 20px rgba(236, 72, 153, 0.3));
        }

.logo-badge {
    display: inline-block;
    background: rgba(30, 15, 45, 0.85);
    border: 1px solid rgba(139, 92, 246, 0.3);
    color: #f5ebe1;
    padding: 12px 35px;
    border-radius: 50px;
    font-size: 1.3rem;
    font-weight: 700;
    backdrop-filter: blur(10px);
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
}

        .title {
            font-size: clamp(3rem, 8vw, 5rem);
            font-weight: 900;
            background: linear-gradient(135deg, #C084FC 0%, #A855F7 50%, #9333EA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin: 15px 0;
            letter-spacing: -1px;
        }

        .subtitle-badge {
            display: inline-block;
            background: linear-gradient(135deg, #EC4899 0%, #A855F7 100%);
            color: #f5ebe1;
            padding: 10px 25px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 700;
            margin-bottom: 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.3);
        }

        .tagline {
            font-size: clamp(0.95rem, 2.5vw, 1.2rem);
            color: #b0a0c0;
            margin: 15px 0;
            font-weight: 500;
            font-style: italic;
        }

        .tagline-highlight {
            color: #f5ebe1;
            font-weight: 700;
        }

        .counter-badge {
            display: inline-block;
            background: rgba(45, 16, 69, 0.8);
            border: 2px solid #EC4899;
            color: #f5ebe1;
            padding: 15px 30px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1.05rem;
            margin-top: 15px;
            animation: pulse 2s ease-in-out infinite;
        }

        .payment-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            margin-bottom: 20px;
            background: #2D1045;
            border: 2px solid #6D28D9;
            border-radius: 50px;
            overflow: hidden;
            max-width: 420px;
            margin-left: auto;
            margin-right: auto;
        }

        .payment-toggle-btn {
            flex: 1;
            padding: 12px 16px;
            border: none;
            background: transparent;
            color: #b0a0c0;
            font-family: 'Poppins', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .payment-toggle-btn.active {
            background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
            color: #f5ebe1;
            box-shadow: 0 2px 10px rgba(139, 92, 246, 0.4);
        }

        .payment-info {
            text-align: center;
            color: #b0a0c0;
            font-size: 0.8rem;
            margin-bottom: 15px;
            font-style: italic;
        }

        .installment-note {
            color: #F59E0B;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .people-selector {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-top: 15px;
        }

        .people-selector-label {
            color: #f5ebe1;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .people-selector-controls {
            display: flex;
            align-items: center;
            gap: 0;
            background: #2D1045;
            border: 2px solid #8B5CF6;
            border-radius: 50px;
            overflow: hidden;
        }

        .people-btn {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: #f5ebe1;
            font-size: 1.3rem;
            font-weight: 800;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .people-btn:hover {
            background: #8B5CF6;
        }

        .people-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        .people-count {
            width: 45px;
            text-align: center;
            color: #f5ebe1;
            font-size: 1.2rem;
            font-weight: 800;
            background: transparent;
        }

        .city-tour-badge {
            display: inline-block;
            background: rgba(16, 185, 129, 0.25);
            border: 2px solid #10B981;
            color: #10B981;
            padding: 8px 20px;
            border-radius: 50px;
            font-size: 0.9rem;
            font-weight: 700;
            margin-left: 10px;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }

        /* STEP CARDS */
        .step-cards-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 35px;
            flex-wrap: wrap;
        }

        .step-card {
            background: rgba(45, 16, 69, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 12px;
            padding: 15px 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .step-card:nth-child(1) { animation-delay: 0.1s; }
        .step-card:nth-child(2) { animation-delay: 0.2s; }
        .step-card:nth-child(3) { animation-delay: 0.3s; }

        .step-card:hover {
            border-color: #A855F7;
            transform: translateY(-4px);
            box-shadow: 0 8px 20px rgba(168, 85, 247, 0.2);
        }

        .step-card-emoji {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .step-card-label {
            color: #6EE7B7;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 2px;
            display: block;
        }

        .step-card-text {
            color: #f5ebe1;
            font-weight: 700;
            font-size: 0.95rem;
        }

        /* FILTERS */
        .filters-section {
            background: rgba(45, 16, 69, 0.6);
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 35px;
            border: 1px solid rgba(236, 72, 153, 0.2);
            backdrop-filter: blur(10px);
        }

        .filter-group {
            margin-bottom: 20px;
        }

        .filter-label {
            font-weight: 700;
            font-size: 0.95rem;
            color: #6EE7B7;
            margin-bottom: 12px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .filter-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .filter-btn {
            padding: 10px 20px;
            border: 2px solid #8B5CF6;
            background: transparent;
            color: #f5ebe1;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
        }

        .filter-btn:hover {
            border-color: #EC4899;
            color: #EC4899;
            transform: translateY(-2px);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #EC4899 0%, #DB2777 100%);
            border-color: #EC4899;
            color: #1a0525;
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.4);
        }

        /* TOURS GRID */
        .tours-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 1.5rem;
            font-weight: 800;
            color: #EC4899;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid rgba(236, 72, 153, 0.3);
        }

        .tours-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 18px;
            margin-bottom: 30px;
        }

        .tour-card {
            background: #2D1045;
            border: 1px solid #9333EA;
            border-radius: 15px;
            overflow: hidden;
            transition: all 0.3s ease;
            cursor: pointer;
            animation: slideUp 0.5s ease-out forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .tour-card:nth-child(1) { animation-delay: 0.05s; }
        .tour-card:nth-child(2) { animation-delay: 0.1s; }
        .tour-card:nth-child(3) { animation-delay: 0.15s; }
        .tour-card:nth-child(4) { animation-delay: 0.2s; }
        .tour-card:nth-child(5) { animation-delay: 0.25s; }
        .tour-card:nth-child(6) { animation-delay: 0.3s; }
        .tour-card:nth-child(n+7) { animation-delay: 0.35s; }

        .tour-card:hover {
            border-color: #EC4899;
            transform: translateY(-8px);
            box-shadow: 0 15px 40px rgba(236, 72, 153, 0.25);
        }

        .tour-image {
            width: 100%;
            height: 160px;
            object-fit: cover;
            position: relative;
        }

        .tour-badges {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .category-badge {
            background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .discount-badge {
            background: #E8651A;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 25px;
            font-size: 0.7rem;
            font-weight: 800;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3);
        }

        .combo-badge {
            background: #6D28D9;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            border: 1px solid #8B5CF6;
        }

        .special-badge {
            background: #DB2777;
            color: #ffffff;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 700;
            border: 1px solid #EC4899;
        }

        .tour-content {
            padding: 14px;
        }

        .tour-name {
            font-size: 0.9rem;
            font-weight: 800;
            color: #f5ebe1;
            margin-bottom: 10px;
            line-height: 1.35;
            word-break: normal;
            overflow-wrap: break-word;
            hyphens: none;
        }

        .tour-desc {
            font-size: 0.8rem;
            color: #f5ebe1;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        .tour-duration {
            display: inline-block;
            background: #0E7490;
            color: #ffffff;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            margin-bottom: 15px;
        }

        .tour-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
        }

        .tour-tag {
            background: #6D28D9;
            color: #ffffff;
            padding: 3px 8px;
            border-radius: 15px;
            font-size: 0.7rem;
            border: 1px solid #7C3AED;
        }

        .tour-button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #EC4899 0%, #A855F7 50%, #8B5CF6 100%);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
        }

        .tour-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(168, 85, 247, 0.5);
        }

        .tour-button.selected {
            background: linear-gradient(135deg, #10B981 0%, #6EE7B7 100%);
            color: #1a0525;
            box-shadow: 0 8px 20px rgba(16, 185, 129, 0.4);
        }

        /* ITINERARY - KANBAN */
        .itinerary-section {
            margin-bottom: 40px;
            text-align: center;
            background: rgba(15, 5, 25, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.15);
            border-radius: 20px;
            padding: 35px 25px;
        }

        .itinerary-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f5ebe1;
            margin-bottom: 10px;
        }

        .itinerary-subtitle {
            color: #b0a0c0;
            font-size: 1rem;
            margin-bottom: 20px;
        }

        .trip-date-picker {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .trip-date-picker label {
            color: #f5ebe1;
            font-weight: 700;
            font-size: 0.95rem;
        }

        .trip-date-picker input[type="date"] {
            background: #2D1045;
            border: 2px solid #8B5CF6;
            border-radius: 12px;
            color: #f5ebe1;
            padding: 10px 16px;
            font-size: 0.95rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            cursor: pointer;
        }

        .trip-date-picker input[type="date"]:focus {
            border-color: #EC4899;
            box-shadow: 0 0 12px rgba(236, 72, 153, 0.3);
        }

        .trip-date-picker input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1);
            cursor: pointer;
        }

        .day-date-label {
            font-size: 0.7rem;
            font-weight: 600;
            opacity: 0.85;
            margin-top: 2px;
            line-height: 1.2;
        }

        .kanban-container {
            display: flex;
            gap: 12px;
            overflow-x: auto;
            padding-bottom: 15px;
            text-align: left;
        }

        .kanban-column {
            flex: 0 0 180px;
            border-radius: 15px;
            overflow: hidden;
            background: rgba(30, 15, 45, 0.6);
            border: 1px solid rgba(139, 92, 246, 0.2);
            min-height: 200px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .kanban-column.drag-over {
            border-color: #EC4899;
            box-shadow: 0 0 20px rgba(236, 72, 153, 0.3);
        }

        .kanban-header {
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 800;
            font-size: 0.95rem;
        }

        .organizar-header {
            background: linear-gradient(135deg, #8B5CF6 0%, #6D28D9 100%);
        }

        .day-header-gradient {
            background: linear-gradient(135deg, #EC4899 0%, #9333EA 100%);
        }

        .day-count-badge {
            background: rgba(255, 255, 255, 0.25);
            width: 26px;
            height: 26px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .kanban-content {
            padding: 8px;
            min-height: 120px;
        }

        .kanban-card {
            background: rgba(45, 16, 69, 0.7);
            border: 1px solid rgba(139, 92, 246, 0.3);
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 8px;
            cursor: grab;
            transition: all 0.2s;
            user-select: none;
        }

        .kanban-card:hover {
            border-color: #EC4899;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(236, 72, 153, 0.2);
        }

        .kanban-card:active {
            cursor: grabbing;
            opacity: 0.7;
        }

        /* Touch-friendly mobile styles */
        @media (max-width: 768px) {
            .kanban-card {
                touch-action: none;
                -webkit-user-select: none;
                user-select: none;
                min-height: 44px;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }
            .kanban-container {
                -webkit-overflow-scrolling: touch;
            }
        }

        .kanban-card-name {
            font-weight: 700;
            font-size: 0.8rem;
            margin-bottom: 4px;
            color: #f5ebe1;
        }

        .kanban-card-duration {
            color: #6EE7B7;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .day-empty {
            text-align: center;
            padding: 30px 10px;
            color: #b0a0c0;
            font-size: 0.85rem;
            font-style: italic;
        }

        .roteiro-progress-bar {
            height: 4px;
            background: linear-gradient(90deg, #8B5CF6 0%, #EC4899 50%, #8B5CF6 100%);
            border-radius: 2px;
            margin-top: 15px;
        }

        .empty-itinerary {
            color: #b0a0c0;
            font-size: 0.85rem;
            margin-top: 10px;
        }

        /* SUMMARY */
        .summary-section {
            text-align: center;
            margin-bottom: 40px;
        }

        .summary-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f5ebe1;
            margin-bottom: 10px;
        }

        .summary-subtitle {
            color: #b0a0c0;
            font-size: 1rem;
            margin-bottom: 25px;
        }

        .summary-card {
            background: #1E0F2D;
            border: 1px solid #6D28D9;
            border-radius: 20px;
            padding: 30px;
            text-align: left;
        }

        .summary-label {
            color: #6EE7B7;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
        }

        .summary-list {
            margin-bottom: 25px;
        }

        .summary-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 0;
            border-bottom: 1px solid #3B1A5E;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-item-name {
            font-weight: 600;
            font-size: 1rem;
        }

        .summary-item-prices {
            text-align: right;
        }

        .price-original {
            text-decoration: line-through;
            color: #F87171;
            font-size: 0.95rem;
            font-weight: 600;
            display: block;
            opacity: 0.9;
        }

        .price-promo {
            color: #6EE7B7;
            font-weight: 800;
            font-size: 1.15rem;
        }

        .summary-totals {
            border-top: 2px solid #6D28D9;
            padding-top: 20px;
            margin-bottom: 25px;
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .savings-box {
            background: linear-gradient(135deg, #0D3B2E 0%, #2D1045 100%);
            border: 2px solid #10B981;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            margin-bottom: 20px;
        }

        .savings-title {
            color: #6EE7B7;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
        }

        .savings-amount {
            color: #10B981;
            font-size: 2.5rem;
            font-weight: 900;
            margin-bottom: 5px;
        }

        .savings-percent {
            color: #b0a0c0;
            font-size: 0.9rem;
        }

        .installment-info {
            text-align: center;
            color: #b0a0c0;
            font-size: 1rem;
            padding: 15px;
        }

        /* BENEFICIOS */
        .beneficios-section {
            margin-bottom: 40px;
            text-align: center;
        }

        .beneficios-title {
            font-size: 2.2rem;
            font-weight: 900;
            color: #f5ebe1;
            margin-bottom: 5px;
        }

        .beneficios-desc {
            color: #b0a0c0;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .beneficios-desc strong {
            color: #6EE7B7;
            font-weight: 800;
        }

        .beneficios-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 15px;
            text-align: left;
        }

        .beneficio-card {
            background: rgba(45, 16, 69, 0.5);
            border: 1px solid rgba(139, 92, 246, 0.25);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            align-items: flex-start;
            gap: 14px;
            transition: all 0.3s ease;
        }

        .beneficio-card:hover {
            border-color: #EC4899;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(236, 72, 153, 0.15);
        }

        .beneficio-emoji {
            font-size: 1.8rem;
            flex-shrink: 0;
        }

        .beneficio-text {
            font-size: 0.9rem;
            color: #f5ebe1;
            font-weight: 500;
            line-height: 1.4;
        }

        /* CTA */
        .cta-section {
            text-align: center;
            padding: 40px 30px;
            margin-bottom: 30px;
        }

        .cta-button {
            display: inline-block;
            padding: 25px 60px;
            background: #10B981;
            color: #ffffff;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 900;
            font-size: 1.3rem;
            transition: all 0.3s ease;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(16, 185, 129, 0.4);
            font-family: 'Poppins', sans-serif;
            border: none;
            cursor: pointer;
        }

        .cta-button:hover {
            transform: translateY(-4px);
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.5);
        }

        .cta-note {
            color: #f5ebe1;
            font-size: 1rem;
            margin-top: 15px;
            font-weight: 700;
            font-weight: 500;
        }

        .no-tours-message {
            text-align: center;
            padding: 40px 20px;
            color: #b0a0c0;
            font-size: 1rem;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .step-cards-container {
                flex-direction: column;
                align-items: center;
            }

            .filters-section {
                padding: 15px;
            }

            .filter-buttons {
                gap: 8px;
            }

            .filter-btn {
                padding: 8px 14px;
                font-size: 0.85rem;
            }

            .tours-grid {
                grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
                gap: 12px;
            }

            .kanban-container {
                gap: 8px;
            }

            .kanban-column {
                flex: 0 0 150px;
            }

            .summary-section {
                padding: 20px;
            }

            .cta-button {
                width: 100%;
                padding: 15px 20px;
            }
        }
    </style>

        // Category emojis
        const CATEGORY_EMOJI = {
            "Cordilheira": "⛰️",
            "Litoral": "🏖️",
            "Cidade": "🏙️",
            "Vinícolas": "🍷",
            "Aventura": "🪂"
        };

        // Portuguese date helpers
        const WEEKDAY_ABBR = ["Dom", "Seg", "Ter", "Qua", "Qui", "Sex", "Sáb"];
        const MONTH_ABBR = ["Jan", "Fev", "Mar", "Abr", "Mai", "Jun", "Jul", "Ago", "Set", "Out", "Nov", "Dez"];

        function formatDateForDay(baseDate, dayOffset) {
            const date = new Date(baseDate);
            date.setDate(date.getDate() + dayOffset);
            const dayOfWeek = WEEKDAY_ABBR[date.getDay()];
            const day = String(date.getDate()).padStart(2, '0');
            const month = MONTH_ABBR[date.getMonth()];
            return `${dayOfWeek}, ${day}/${month}`;
        }

        // Main App Component
        function App() {
            const [selectedTours, setSelectedTours] = React.useState([]);

            const [categoryFilter, setCategoryFilter] = React.useState("todos");

            const [paymentMethod, setPaymentMethod] = React.useState("pix"); // "pix" ou "parcelado"

            // Filter tours based on season and category
            const filteredTours = React.useMemo(() => {
                return TOUR_DATA.filter(tour => {
                    const seasonMatch =
                        seasonFilter === "todos" ||
                        tour.season === seasonFilter ||
                        tour.season === "ambas";

                    const categoryMatch =
                        categoryFilter === "todos" ||
                        tour.category === categoryFilter;

                    return seasonMatch && categoryMatch;
                });
            }, [seasonFilter, categoryFilter]);

            // Group filtered tours by category for display
            const toursByCategory = React.useMemo(() => {
                const groups = {};
                filteredTours.forEach(tour => {
                    if (!groups[tour.category]) {
                        groups[tour.category] = [];
                    }
                    groups[tour.category].push(tour);
                });
                return groups;
            }, [filteredTours]);

            // Toggle tour selection
            const toggleTour = (tourId) => {
                setSelectedTours(prev => {
                    const isSelected = prev.includes(tourId);
                    if (isSelected) {
                        // Also remove from day assignments
                        setDayAssignments(da => {
                            const copy = {...da};
                            delete copy[tourId];
                            return copy;
                        });
                        return prev.filter(id => id !== tourId);
                    } else {
                        // Just add to selected tours (no auto-assign to day)
                        return [...prev, tourId];
                    }
                });
            };

            // Get selected tour objects
            const selectedTourObjects = React.useMemo(() => {
                return selectedTours.map(id => TOUR_DATA.find(t => t.id === id));
            }, [selectedTours]);

            // Tours NOT yet assigned to any day (stay in "Organizar" column)
            const unassignedTours = React.useMemo(() => {
                return selectedTourObjects.filter(t => dayAssignments[t.id] === undefined);
            }, [selectedTourObjects, dayAssignments]);

            // Build day columns (7 days)
            const dayColumns = React.useMemo(() => {
                const days = Array.from({ length: 7 }, () => []);
                selectedTourObjects.forEach(tour => {
                    const dayIdx = dayAssignments[tour.id];
                    if (dayIdx !== undefined && dayIdx >= 0 && dayIdx < 7) {
                        days[dayIdx].push(tour);
                    }
                });
                return days;
            }, [selectedTourObjects, dayAssignments]);

            // Calculate financial summary
            const summary = React.useMemo(() => {
                let totalOriginalPP = 0;
                let totalPromoPP = 0;

                selectedTourObjects.forEach(tour => {
                    const isPix = paymentMethod === "pix";
                    let promoPrice;

                    if (tour.id === 17 && selectedTours.length < 3) {
                        // City Tour sem combo: preço cheio
                        promoPrice = tour.priceBRL;
                    } else if (tour.id === 17) {
                        // City Tour com combo: R$ 20 (pix) ou R$ 22.21 (3x)
                        promoPrice = isPix ? 20 : (tour.price3xBRL || 22.21);
                    } else if (!tour.hasPromo) {
                        // Tours sem promoção (Infinitum etc): preço fixo
                        promoPrice = tour.priceBRL;
                    } else {
                        // Tours com promoção: pix usa promoBRL, 3x usa price3xBRL
                        promoPrice = isPix ? tour.promoBRL : (tour.price3xBRL || tour.promoBRL);
                    }

                    totalOriginalPP += tour.priceBRL;
                    totalPromoPP += promoPrice;
                });

                const totalOriginal = totalOriginalPP * numPeople;
                const totalPromo = totalPromoPP * numPeople;
                const savings = totalOriginal - totalPromo;

                return {
                    totalOriginalPP: totalOriginalPP.toFixed(2),
                    totalPromoPP: totalPromoPP.toFixed(2),
                    totalOriginal: totalOriginal.toFixed(2),
                    totalPromo: totalPromo.toFixed(2),
                    savings: savings.toFixed(2)
                };
            }, [selectedTourObjects, selectedTours.length, numPeople, paymentMethod]);

            // Drag: source can be "organizar" or a day index
            const handleDragStart = (e, tour, source) => {
                setDraggedTour({ tour, source });
                e.dataTransfer.effectAllowed = "move";
            };

            const handleDragOver = (e) => {
                e.preventDefault();
                e.dataTransfer.dropEffect = "move";
            };

            const handleDragEnter = (target) => {
                setDragOverTarget(target);
            };

            const handleDragLeave = () => {
                setDragOverTarget(null);
            };

            // Drop onto a day column
            const handleDropOnDay = (e, dayIndex) => {
                e.preventDefault();
                setDragOverTarget(null);
                if (!draggedTour) return;
                setDayAssignments(prev => ({
                    ...prev,
                    [draggedTour.tour.id]: dayIndex
                }));
                setDraggedTour(null);
            };

            // Drop back onto "Organizar" (unassign)
            const handleDropOnOrganizar = (e) => {
                e.preventDefault();
                setDragOverTarget(null);
                if (!draggedTour) return;
                setDayAssignments(prev => {
                    const copy = {...prev};
                    delete copy[draggedTour.tour.id];
                    return copy;
                });
                setDraggedTour(null);
            };

            // ===== TOUCH SUPPORT FOR MOBILE =====
            const touchRef = React.useRef({ tour: null, source: null, ghost: null, startY: 0, startX: 0 });

            const handleTouchStart = (e, tour, source) => {
                const touch = e.touches[0];
                touchRef.current = { tour, source, ghost: null, startX: touch.clientX, startY: touch.clientY, moved: false };
            };

            const handleTouchMove = (e) => {
                const td = touchRef.current;
                if (!td.tour) return;
                const touch = e.touches[0];
                const dx = Math.abs(touch.clientX - td.startX);
                const dy = Math.abs(touch.clientY - td.startY);
                if (!td.moved && dx < 10 && dy < 10) return;
                td.moved = true;
                e.preventDefault();

                // Create ghost element
                if (!td.ghost) {
                    const ghost = document.createElement('div');
                    ghost.textContent = td.tour.name;
                    ghost.style.cssText = 'position:fixed;z-index:9999;background:#6D28D9;color:#f5ebe1;padding:8px 14px;border-radius:10px;font-size:0.85rem;font-weight:700;pointer-events:none;box-shadow:0 4px 20px rgba(0,0,0,0.4);font-family:Poppins,sans-serif;max-width:180px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
                    document.body.appendChild(ghost);
                    td.ghost = ghost;
                    setDraggedTour({ tour: td.tour, source: td.source });
                }
                td.ghost.style.left = (touch.clientX - 60) + 'px';
                td.ghost.style.top = (touch.clientY - 20) + 'px';

                // Detect which column we're over
                const cols = document.querySelectorAll('.kanban-column');
                let found = false;
                cols.forEach((col, idx) => {
                    const rect = col.getBoundingClientRect();
                    if (touch.clientX >= rect.left && touch.clientX <= rect.right && touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        const colIdx = col.classList.contains('organizar-column') ? 'organizar' : idx - 1;
                        setDragOverTarget(colIdx);
                        found = true;
                    }
                });
                if (!found) setDragOverTarget(null);
            };

            const handleTouchEnd = (e) => {
                const td = touchRef.current;
                if (td.ghost) {
                    document.body.removeChild(td.ghost);
                }
                if (!td.tour || !td.moved) {
                    touchRef.current = { tour: null, source: null, ghost: null, startX: 0, startY: 0, moved: false };
                    setDraggedTour(null);
                    setDragOverTarget(null);
                    return;
                }

                // Find drop target from last touch position
                const touch = e.changedTouches[0];
                const cols = document.querySelectorAll('.kanban-column');
                let dropped = false;
                cols.forEach((col, idx) => {
                    const rect = col.getBoundingClientRect();
                    if (touch.clientX >= rect.left && touch.clientX <= rect.right && touch.clientY >= rect.top && touch.clientY <= rect.bottom) {
                        if (col.classList.contains('organizar-column')) {
                            // Drop on organizar
                            setDayAssignments(prev => {
                                const copy = {...prev};
                                delete copy[td.tour.id];
                                return copy;
                            });
                        } else {
                            // Drop on day column (idx - 1 because first column is organizar)
                            const dayIndex = idx - 1;
                            if (dayIndex >= 0) {
                                setDayAssignments(prev => ({
                                    ...prev,
                                    [td.tour.id]: dayIndex
                                }));
                            }
                        }
                        dropped = true;
                    }
                });

                touchRef.current = { tour: null, source: null, ghost: null, startX: 0, startY: 0, moved: false };
                setDraggedTour(null);
                setDragOverTarget(null);
            };

            // Remove tour entirely
            const removeTour = (tourId) => {
                toggleTour(tourId);
            };

            const showCityTourBadge = selectedTours.length >= 3;

                <React.Fragment>

                <div className="sparkle">✧</div>
                <div className="sparkle">✦</div>
                <div className="sparkle">✧</div>
                <div className="sparkle">✦</div>
                <div className="sparkle">✧</div>

                                        💳 <strong style={{color: '#10B981'}}>3x sem juros</strong> de <strong style={{color: '#10B981'}}>R$ {(parseFloat(summary.totalPromo) / 3).toFixed(2).replace('.', ',')}</strong>
                                    </div>
                                )}
                            </div>
                        </div>
                    ) : (
                        <div className="no-tours-message">
                            Selecione passeios para ver o resumo financeiro
                        </div>
                    )}

                    {/* BENEFICIOS */}
                    <div className="beneficios-section">
                        <h2 className="beneficios-title">🎁 Benefícios da Promoção</h2>
                        <p className="beneficios-desc">Com entrada de <strong>R$50</strong> você acessa:</p>

                        <div className="beneficios-grid">
                            <div className="beneficio-card">
                                <span className="beneficio-emoji">🚐</span>
                                <span className="beneficio-text">Desconto no transfer de ida e volta do aeroporto</span>
                            </div>
                            <div className="beneficio-card">
                                <span className="beneficio-emoji">🍷</span>
                                <span className="beneficio-text">Descontos em bares, restaurantes e hotéis de Santiago e San Pedro de Atacama</span>
                            </div>
                            <div className="beneficio-card">
                                <span className="beneficio-emoji">📱</span>
                                <span className="beneficio-text">Aplicativo exclusivo com vários e-books sobre o Chile</span>
                            </div>
                            <div className="beneficio-card">
                                <span className="beneficio-emoji">💬</span>
                                <span className="beneficio-text">Acesso à comunidade dos WeLovers</span>
                            </div>
                            <div className="beneficio-card">
                                <span className="beneficio-emoji">📶</span>
                                <span className="beneficio-text">Descontos em pacotes de internet com chip E-sim</span>
                            </div>
                            <div className="beneficio-card">
                                <span className="beneficio-emoji">💡</span>
                                <span className="beneficio-text">1 Consultoria mensal GRÁTIS</span>
                            </div>
                            <div className="beneficio-card">
                                <span className="beneficio-emoji">🏷️</span>
                                <span className="beneficio-text">Até 30% de desconto nos passeios de Santiago e Atacama</span>
                            </div>
                            <div className="beneficio-card">
                                <span className="beneficio-emoji">🏙️</span>
                                <span className="beneficio-text">City Tour por apenas R$20</span>
                            </div>
                        </div>
                    </div>

                    {/* CTA */}
                    <div className="cta-section">
                        <a
                            href="#"
                            onClick={(e) => {
                                e.preventDefault();
                                const tourNames = selectedTourObjects.map(t => `• ${t.name}`).join('\n');
                                const pagamento = paymentMethod === "pix" ? "Pix/Wise (à vista)" : "Parcelado 3x sem juros";
                                const msg = `Oiee, vim pelo "Planejador de Combos" da Laíse :)\nQuantidade de pessoas: ${numPeople}\nForma de pagamento: ${pagamento}\nEsses foram os passeios que selecionei pra fazer:\n${tourNames}\nGostaria de prosseguir com a reserva pra aproveitar a promoção!`;
                                navigator.clipboard.writeText(msg).then(() => {
                                    alert('✅ Mensagem copiada! Cole no chat do WhatsApp 😉');
                                    window.open('https://curt.link/Comunidade2026', '_blank');
                                }).catch(() => {
                                    window.open('https://curt.link/Comunidade2026', '_blank');
                                });
                            }}
                            className="cta-button"
                        >
                            📱 Falar com a We Love Chile
                        </a>
                        <div className="cta-note">
                            Aproveite! Promoção válida somente em Abril de 2026
                        </div>
                    </div>
                </div>
                </React.Fragment>
            );
        }

        // Render App
        const root = ReactDOM.createRoot(document.getElementById("root"));
        root.render(<App />);
    </script>
</body>
