function PlanejadorCombosAtacama() {
  const [selected, setSelected] = React.useState(new Set());
  const [dayMap, setDayMap] = React.useState({});
  const [activeCat, setActiveCat] = React.useState("all");

  const toggleTour = React.useCallback((id) => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(id)) {
        next.delete(id);
        setDayMap((dm) => { const copy = { ...dm }; delete copy[id]; return copy; });
      } else {
        next.add(id);
        setDayMap((dm) => {
          const counts = {};
          for (let d = 1; d <= 7; d++) counts[d] = 0;
          Object.values(dm).forEach((d) => { counts[d] = (counts[d] || 0) + 1; });
          let minDay = 1, minCount = Infinity;
          for (let d = 1; d <= 7; d++) { if (counts[d] < minCount) { minCount = counts[d]; minDay = d; } }
          return { ...dm, [id]: minDay };
        });
      }
      return next;
    });
  }, []);

  const moveTour = React.useCallback((tourId, newDay) => {
    setDayMap((dm) => ({ ...dm, [tourId]: newDay }));
  }, []);

  const selectedTours = React.useMemo(() => TOURS.filter((t) => selected.has(t.id)), [selected]);
  const totalCount = selectedTours.length;

  const financials = React.useMemo(() => {
    let totalOriginalBRL = 0, totalPromoBRL = 0, totalOriginalCLP = 0, totalPromoCLP = 0;
    selectedTours.forEach((t) => {
      totalOriginalBRL += t.priceBRL;
      totalPromoBRL += t.promoBRL;
      totalOriginalCLP += t.priceCLP;
      totalPromoCLP += t.promoCLP;
    });
    return { totalOriginalBRL, totalPromoBRL, economiaBRL: totalOriginalBRL - totalPromoBRL, totalOriginalCLP, totalPromoCLP, economiaCLP: totalOriginalCLP - totalPromoCLP };
  }, [selectedTours]);

  const dayColumns = React.useMemo(() => {
    const cols = {};
    for (let d = 1; d <= 7; d++) cols[d] = [];
    selectedTours.forEach((t) => { const day = dayMap[t.id] || 1; if (cols[day]) cols[day].push(t); });
    return cols;
  }, [selectedTours, dayMap]);

      <section style={{ maxWidth: 1200, margin: "0 auto", padding: "0 20px 20px" }}>
        <div style={{ display: "flex", flexWrap: "wrap", gap: 8, justifyContent: "center" }}>
          <button onClick={() => setActiveCat("all")} style={{ background: activeCat === "all" ? "linear-gradient(135deg, #D97706, #DC2626)" : "rgba(255,255,255,0.08)", border: activeCat === "all" ? "none" : "1px solid rgba(255,255,255,0.15)", color: "#fff", borderRadius: 30, padding: "8px 20px", fontSize: 14, fontWeight: 600, cursor: "pointer" }}>
            Todos ({TOURS.length})
          </button>
          {CATEGORIES.map((cat) => {
            const count = TOURS.filter((t) => t.cat === cat.id).length;
            return (
              <button key={cat.id} onClick={() => setActiveCat(cat.id)} style={{ background: activeCat === cat.id ? cat.color : "rgba(255,255,255,0.08)", border: activeCat === cat.id ? "none" : "1px solid rgba(255,255,255,0.15)", color: "#fff", borderRadius: 30, padding: "8px 18px", fontSize: 13, fontWeight: 600, cursor: "pointer", display: "inline-flex", alignItems: "center", gap: 6 }}>
                <span>{CAT_ICONS[cat.id]}</span>
                {cat.label} ({count})
              </button>
            );
          })}
        </div>
      </section>

      {/* TOUR CARDS GRID */}
      <section style={{ maxWidth: 1300, margin: "0 auto", padding: "0 20px 40px" }}>
        <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(280px, 1fr))", gap: 20 }}>
          {filteredTours.map((tour) => {
            const isSelected = selected.has(tour.id);
            const catColor = getCatColor(tour.cat);
            const catLabel = CATEGORIES.find(c => c.id === tour.cat)?.label || "";
            return (
              <div key={tour.id} onClick={() => toggleTour(tour.id)}
                style={{ borderRadius: 16, overflow: "hidden", cursor: "pointer", transition: "all 0.3s",
                  transform: isSelected ? "scale(1.02)" : "scale(1)",
                  boxShadow: isSelected ? `0 0 0 3px ${catColor}, 0 8px 32px rgba(0,0,0,0.4)` : "0 4px 16px rgba(0,0,0,0.3)",
                  background: "rgba(255,255,255,0.06)",
                  border: isSelected ? "none" : "1px solid rgba(255,255,255,0.08)",
                }}>
                {/* Image */}
                <div style={{ position: "relative", height: 180, overflow: "hidden", background: "#2d1500" }}>
                  <img src={tour.img} alt={tour.name}
                    style={{ width: "100%", height: "100%", objectFit: "cover", filter: isSelected ? "brightness(0.7)" : "brightness(0.85)", transition: "all 0.3s" }}
                    onError={(e) => { e.target.style.display = "none"; }}
                  />
                  <div style={{ position: "absolute", bottom: 0, left: 0, right: 0, height: 80, background: "linear-gradient(transparent, rgba(0,0,0,0.7))" }} />
                  {/* Category badge */}
                  <div style={{ position: "absolute", top: 12, left: 12, background: catColor, borderRadius: 20, padding: "4px 12px", fontSize: 11, fontWeight: 700, display: "inline-flex", alignItems: "center", gap: 4, textTransform: "uppercase" }}>
                    <span>{CAT_ICONS[tour.cat]}</span>
                    {catLabel}
                  </div>
                  {/* Discount badge */}
                  {tour.discount > 0 && (
                    <div style={{ position: "absolute", top: 12, right: 12, background: tour.discount >= 20 ? "#DC2626" : "#EA580C", borderRadius: 20, padding: "4px 12px", fontSize: 13, fontWeight: 800 }}>
                      -{tour.discount}%
                    </div>
                  )}
                  {/* Selected checkmark */}
                  {isSelected && (
                    <div style={{ position: "absolute", top: "50%", left: "50%", transform: "translate(-50%, -50%)", background: "#10B981", borderRadius: "50%", width: 52, height: 52, display: "flex", alignItems: "center", justifyContent: "center", fontSize: 24, boxShadow: "0 4px 12px rgba(0,0,0,0.4)" }}>
                      ✓
                    </div>
                  )}
                  {/* Duration badge */}
                  <div style={{ position: "absolute", bottom: 10, right: 12, background: "rgba(0,0,0,0.6)", borderRadius: 12, padding: "3px 10px", fontSize: 11, fontWeight: 600 }}>
                    ⏱ {tour.duration}
                  </div>
                </div>
                {/* Content */}
                <div style={{ padding: "14px 16px 16px" }}>
                  <h3 style={{ fontSize: 16, fontWeight: 700, margin: "0 0 6px", lineHeight: 1.3 }}>{tour.name}</h3>
                  <p style={{ fontSize: 12.5, color: "#FDE68A", margin: "0 0 10px", lineHeight: 1.5 }}>{tour.desc}</p>
                  {/* Tags */}
                  <div style={{ display: "flex", flexWrap: "wrap", gap: 5, marginBottom: 10 }}>
                    {tour.tags.map((tag) => (
                      <span key={tag} style={{ background: "rgba(255,255,255,0.1)", borderRadius: 10, padding: "2px 10px", fontSize: 11, fontWeight: 500, color: "#FCD34D" }}>
                        {tag}
                      </span>
                    ))}
                  </div>
                  {/* Price block */}
                  <div style={{ background: "rgba(0,0,0,0.25)", borderRadius: 10, padding: "8px 12px", marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div>
                        <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)", textDecoration: "line-through" }}>
                          {fmtBRL(tour.priceBRL)} / {fmtCLP(tour.priceCLP)}
                        </div>
                        <div style={{ fontSize: 17, fontWeight: 800, color: "#6EE7B7" }}>{fmtBRL(tour.promoBRL)}</div>
                        <div style={{ fontSize: 11, color: "#FCD34D" }}>{fmtCLP(tour.promoCLP)} pesos</div>
                      </div>
                      <div style={{ textAlign: "right" }}>
                        <div style={{ fontSize: 10, color: "rgba(255,255,255,0.4)" }}>3x sem juros</div>
                        <div style={{ fontSize: 13, fontWeight: 700, color: "#A7F3D0" }}>{fmtBRL(tour.parcela3xBRL)}</div>
                        <div style={{ fontSize: 10, color: "#FCD34D" }}>{fmtCLP(tour.parcela3xCLP)}</div>
                      </div>
                    </div>
                  </div>
                  {/* Select button */}
                  <button style={{ width: "100%", padding: "10px", borderRadius: 10, border: "none", fontSize: 14, fontWeight: 700, cursor: "pointer",
                    background: isSelected ? "#10B981" : "linear-gradient(135deg, #D97706, #DC2626)", color: "#fff",
                    display: "flex", alignItems: "center", justifyContent: "center", gap: 6 }}>
                    {isSelected ? "✓ Selecionado!" : "❤️ Quero ir!"}
                  </button>
                </div>
              </div>
            );
          })}
        </div>
      </section>

      {/* ITINERARY BOARD */}
      {itineraryVisible && (
        <section style={{ padding: "40px 20px", background: "linear-gradient(180deg, rgba(135,62,28,0.4), rgba(45,21,0,0.6))", borderTop: "1px solid rgba(255,255,255,0.1)" }}>
          <div style={{ maxWidth: 1300, margin: "0 auto" }}>
            <div style={{ textAlign: "center", marginBottom: 24 }}>
              <h2 style={{ fontSize: "clamp(22px, 4vw, 32px)", fontWeight: 800, margin: "0 0 6px", display: "flex", alignItems: "center", justifyContent: "center", gap: 10 }}>
                📅 Seu Roteiro no Atacama
              </h2>
              <p style={{ color: "#FDE68A", fontSize: 14 }}>Clique nos botões para mover passeios entre os dias</p>
            </div>

            <div style={{ display: "flex", gap: 14, overflowX: "auto", paddingBottom: 16 }}>
              {[1, 2, 3, 4, 5, 6, 7].map((day) => {
                const tours = dayColumns[day] || [];
                return (
                  <div key={day} style={{ minWidth: 220, maxWidth: 260, flexShrink: 0, background: "rgba(255,255,255,0.05)", borderRadius: 14, border: "1px solid rgba(255,255,255,0.1)", overflow: "hidden" }}>
                    <div style={{ background: tours.length > 0 ? "linear-gradient(135deg, #D97706, #DC2626)" : "rgba(255,255,255,0.08)", padding: "12px 14px", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
                      <span style={{ fontWeight: 800, fontSize: 15 }}>{dayNames[day]}</span>
                      <span style={{ background: "rgba(255,255,255,0.2)", borderRadius: 10, padding: "2px 8px", fontSize: 12, fontWeight: 700 }}>{tours.length}</span>
                    </div>
                    <div style={{ padding: 10, minHeight: 80, display: "flex", flexDirection: "column", gap: 8 }}>
                      {tours.length === 0 && (
                        <div style={{ textAlign: "center", padding: 20, color: "rgba(255,255,255,0.3)", fontSize: 13, fontStyle: "italic" }}>
                          Dia livre
                        </div>
                      )}
                      {tours.map((t) => {
                        const catColor = getCatColor(t.cat);
                        return (
                          <div key={t.id} style={{ background: "rgba(255,255,255,0.08)", borderRadius: 10, padding: 10, borderLeft: `3px solid ${catColor}` }}>
                            <div style={{ fontSize: 13, fontWeight: 700, marginBottom: 4, lineHeight: 1.3 }}>{t.name}</div>
                            <div style={{ fontSize: 11, color: "#FDE68A", marginBottom: 8 }}>⏱ {t.duration}</div>
                            <div style={{ display: "flex", gap: 4, flexWrap: "wrap" }}>
                              {[1, 2, 3, 4, 5, 6, 7].filter((d) => d !== day).map((d) => (
                                <button key={d} onClick={(e) => { e.stopPropagation(); moveTour(t.id, d); }}
                                  style={{ background: "rgba(255,255,255,0.1)", border: "1px solid rgba(255,255,255,0.15)", color: "#FDE68A", borderRadius: 6, padding: "2px 8px", fontSize: 10, cursor: "pointer", fontWeight: 600 }}>
                                  D{d}
                                </button>
                              ))}
                              <button onClick={(e) => { e.stopPropagation(); toggleTour(t.id); }}
                                style={{ background: "rgba(220,38,38,0.2)", border: "1px solid rgba(220,38,38,0.4)", color: "#FCA5A5", borderRadius: 6, padding: "2px 6px", fontSize: 10, cursor: "pointer" }}>
                                ✕
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        </section>
      )}

      {/* FINANCIAL SUMMARY */}
      {itineraryVisible && (
        <section style={{ padding: "40px 20px 60px", background: "linear-gradient(180deg, rgba(45,21,0,0.6), rgba(26,10,0,1))" }}>
          <div style={{ maxWidth: 800, margin: "0 auto" }}>
            <div style={{ textAlign: "center", marginBottom: 24 }}>
              <h2 style={{ fontSize: "clamp(22px, 4vw, 32px)", fontWeight: 800, margin: "0 0 6px" }}>
                💰 Planejamento Financeiro
              </h2>
              <p style={{ color: "#FDE68A", fontSize: 14 }}>Veja quanto você economiza com os combos Atacama</p>
            </div>

            <div style={{ background: "rgba(255,255,255,0.06)", borderRadius: 20, border: "1px solid rgba(255,255,255,0.1)", overflow: "hidden" }}>
              <div style={{ padding: "20px 20px 10px" }}>
                <div style={{ fontSize: 13, fontWeight: 700, color: "#FCD34D", textTransform: "uppercase", letterSpacing: 1, marginBottom: 12 }}>
                  Seus passeios selecionados
                </div>
                {selectedTours.map((t) => (
                  <div key={t.id} style={{ display: "flex", justifyContent: "space-between", alignItems: "center", padding: "10px 0", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 14, fontWeight: 600 }}>{t.name}</div>
                      <div style={{ fontSize: 11, color: "#FDE68A" }}>{CATEGORIES.find(c => c.id === t.cat)?.label}</div>
                    </div>
                    <div style={{ textAlign: "right" }}>
                      <div style={{ fontSize: 12, color: "#F87171", textDecoration: "line-through" }}>{fmtBRL(t.priceBRL)}</div>
                      <div style={{ fontSize: 15, fontWeight: 700, color: "#6EE7B7" }}>{fmtBRL(t.promoBRL)}</div>
                      <div style={{ fontSize: 11, color: "#FCD34D" }}>{fmtCLP(t.promoCLP)}</div>
                    </div>
                  </div>
                ))}
              </div>

              <div style={{ background: "rgba(255,255,255,0.04)", padding: 20, borderTop: "1px solid rgba(255,255,255,0.1)" }}>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 8 }}>
                  <span style={{ color: "#FDE68A", fontSize: 14 }}>Total sem promoção:</span>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ color: "#F87171", fontSize: 14, fontWeight: 600, textDecoration: "line-through" }}>{fmtBRL(financials.totalOriginalBRL)}</div>
                    <div style={{ color: "#F87171", fontSize: 11, textDecoration: "line-through" }}>{fmtCLP(financials.totalOriginalCLP)}</div>
                  </div>
                </div>
                <div style={{ display: "flex", justifyContent: "space-between", marginBottom: 12 }}>
                  <span style={{ color: "#FDE68A", fontSize: 14 }}>Total com promoção:</span>
                  <div style={{ textAlign: "right" }}>
                    <div style={{ color: "#6EE7B7", fontSize: 20, fontWeight: 800 }}>{fmtBRL(financials.totalPromoBRL)}</div>
                    <div style={{ color: "#FCD34D", fontSize: 13 }}>{fmtCLP(financials.totalPromoCLP)}</div>
                  </div>
                </div>

                <div style={{ background: "linear-gradient(135deg, rgba(16,185,129,0.15), rgba(16,185,129,0.05))", border: "1px solid rgba(16,185,129,0.3)", borderRadius: 14, padding: "16px 20px", textAlign: "center" }}>
                  <div style={{ fontSize: 12, color: "#6EE7B7", fontWeight: 700, textTransform: "uppercase", letterSpacing: 1.5, marginBottom: 4 }}>
                    Sua economia total
                  </div>
                  <div style={{ fontSize: 32, fontWeight: 900, color: "#6EE7B7" }}>
                    {fmtBRL(financials.economiaBRL)}
                  </div>
                  <div style={{ fontSize: 14, color: "#FCD34D", marginTop: 4 }}>
                    {fmtCLP(financials.economiaCLP)} pesos chilenos
                  </div>
                  {financials.totalOriginalBRL > 0 && (
                    <div style={{ fontSize: 13, color: "#A7F3D0", marginTop: 4 }}>
                      {((financials.economiaBRL / financials.totalOriginalBRL) * 100).toFixed(0)}% de desconto no combo!
                    </div>
                  )}
                </div>

                <div style={{ marginTop: 16, textAlign: "center", color: "#FDE68A", fontSize: 13 }}>
                  💳 Parcele em até <strong style={{ color: "#FCD34D" }}>3x sem juros</strong> de <strong style={{ color: "#6EE7B7" }}>{fmtBRL(financials.totalPromoBRL / 3)}</strong>
                </div>
              </div>
            </div>

            <div style={{ textAlign: "center", marginTop: 30 }}>
              <a href="https://wa.me/56232106606?text=Oi! Quero montar meu combo de passeios no Deserto do Atacama com a We Love Chile!"
                target="_blank" rel="noopener noreferrer"
                style={{ display: "inline-flex", alignItems: "center", gap: 10, background: "linear-gradient(135deg, #10B981, #059669)", color: "#fff", borderRadius: 30, padding: "16px 40px", fontSize: 18, fontWeight: 800, textDecoration: "none", boxShadow: "0 4px 20px rgba(16,185,129,0.4)" }}>
                📱 Falar com a We Love Chile
              </a>
              <p style={{ marginTop: 14, color: "#D97706", fontSize: 12 }}>
                San Pedro de Atacama — Caracoles 419, e5 | +56 232 106 606
              </p>
            </div>
          </div>
        </section>
      )}

      {/* FOOTER */}
      <footer style={{ textAlign: "center", padding: "30px 20px", borderTop: "1px solid rgba(255,255,255,0.06)" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "center", gap: 8, marginBottom: 8 }}>
          <span>❤️</span>
          <span style={{ fontWeight: 700, fontSize: 15 }}>We Love Chile</span>
        </div>
        <p style={{ color: "rgba(255,255,255,0.3)", fontSize: 12 }}>
          Planejador de Combos — Deserto do Atacama 2026
        </p>
      </footer>
    </div>
  );
}

ReactDOM.render(React.createElement(PlanejadorCombosAtacama), document.getElementById("root"));
</script>
</body>
</html>
